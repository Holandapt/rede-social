[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "lucas",email = "holanda.ptr@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "pillow (>=13.0.0,<14.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)"
]
